name: "Build kernels"

env:
  OUT_DIR: "${{ github.workspace }}/out"

on:
  workflow_dispatch:
    inputs:
      target:
        description: 'Which kernel to build'
        required: true
        default: 'both'
        type: choice
        options:
          - both
          - 90hz
          - 120hz

jobs:
  Set-repos:
    name: "Parse repos.json"
    runs-on: ubuntu-22.04
    outputs:
      repos: ${{ steps.generate-matrix.outputs.repos }}
      builddate: ${{ steps.generate-builddate.outputs.builddate }}
    steps:
      - name: "Checkout"
        uses: actions/checkout@v4

      - name: "Generate Matrix"
        id: generate-matrix
        run: |
          echo "repos<<EOF" >> $GITHUB_OUTPUT
          if [ "${{ inputs.target }}" = "both" ]; then
            jq -s '[.[][]]' repos/repos.sony-*.json >> $GITHUB_OUTPUT
          else
            jq -s '[.[][]]' repos/repos.sony-${{ inputs.target }}.json >> $GITHUB_OUTPUT
          fi
          echo "EOF" >> $GITHUB_OUTPUT
      - name: "Set builddate"
        id: generate-builddate
        run: echo "builddate=$(date +'%Y%m%d')" >> $GITHUB_OUTPUT

  Build-Kernel:
    name: "Build kernel"
    runs-on: ubuntu-22.04
    needs:
      - Set-repos
    strategy:
      max-parallel: 4
      fail-fast: false
      matrix:
        repos: ${{ fromJSON(needs.Set-repos.outputs.repos) }}
    env:
      WORKSPACE: ${{ github.workspace }}

      builddate: "${{ needs.Set-repos.outputs.builddate }}"

      KERNEL_NAME: ${{ matrix.repos.kernelSource.name }}
      KERNEL_REPO: ${{ matrix.repos.kernelSource.repo }}
      KERNEL_BRANCH: ${{ matrix.repos.kernelSource.branch }}
      KERNEL_DEVICE: ${{ matrix.repos.kernelSource.device }}

      DEFCONFIG_NAME: ${{ matrix.repos.kernelSource.defconfig }}

      ccache: ${{ matrix.repos.ccache }}
    steps:
      - name: "Install prerequisites"
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential bc gcc-aarch64-linux-gnu gcc-arm-linux-gnueabi libssl-dev libfl-dev
          sudo apt-get install -y curl git ftp lftp wget libarchive-tools ccache python3 python3-dev
          sudo apt-get install -y zip unzip tar gzip bzip2 rar unrar

      - name: "Create cache key from repos"
        if: ${{ env.ccache == 'true' }}
        id: ccache_key
        run: |
          ccache -o compression=false -o cache_dir=$HOME/.ccache
          echo "CACHE_KEY=$(echo -n '${{ toJSON(matrix.repos) }}' | base64 -w 0 | cut -c -48)" >> $GITHUB_OUTPUT

      - name: "Cache ccache files"
        if: ${{ env.ccache == 'true' }}
        uses: actions/cache@v4
        with:
          path: |
            ~/.ccache
            ${{ env.OUT_DIR }}
          key: ccache-${{ env.KERNEL_NAME }}-${{ steps.ccache_key.outputs.CACHE_KEY }}-${{ env.builddate }}
          restore-keys: |
            ccache-${{ env.KERNEL_NAME }}-${{ steps.ccache_key.outputs.CACHE_KEY }}-${{ env.builddate }}

      - name: "Clone kernel source"
        run: |
          git clone --recursive --depth=1 -j $(nproc) --branch $KERNEL_BRANCH $KERNEL_REPO $KERNEL_NAME
          echo "Clone kernel source => ($KERNEL_REPO)"

      - name: "Get toolchains"
        env:
          toolchains: "${{ toJSON(matrix.repos.toolchains) }}"
        run: |
          toolchains_num="$(echo $toolchains | jq 'length')"
          echo "There is $toolchains_num defined toolchains."
          for ((i=0;i<toolchains_num;i++)); do
            toolchain_name=$(echo $toolchains | jq -r ".[$i].name")
            toolchain_repo=$(echo $toolchains | jq -r ".[$i].repo")
            toolchain_branch=$(echo $toolchains | jq -r ".[$i].branch")
            toolchain_url=$(echo $toolchains | jq -r ".[$i].url")
            
            echo $toolchain_url
            if [ -z "${toolchain_url:-}" ] || [ "$toolchain_url" = "null" ];  then
              git clone --recursive --depth=1 -j $(nproc) --branch $toolchain_branch $toolchain_repo $toolchain_name
              echo "Clone $toolchain_name => ($toolchain_repo)"
            else
              wget "$toolchain_url"
              filename="${toolchain_url##*/}"
              mkdir -p $toolchain_name
              case "$filename" in
                *.zip)
                  unzip -d $toolchain_name "$filename"
                  ;;
                *.tar)
                  tar xvf "$filename" -C $toolchain_name
                  ;;
                *.tar.gz)
                  tar zxvf "$filename" -C $toolchain_name
                  ;;
                *.rar)
                  unrar x "$filename" $toolchain_name
                  ;;
                *)
                  echo "unknown file type: $filename"
                  ;;
              esac
            fi

            jq -r ".[$i].binPath[] | tostring" <<< "$toolchains" | while read -r bin_path; do
              echo "$WORKSPACE/$toolchain_name/$bin_path" >> $GITHUB_PATH
            done
          done

      - name: "Fix proton-clang ld symlink"
        run: |
          # Remove proton-clang's GNU ld symlink to avoid glibc .relr.dyn issues on host
          # Kernel uses ld.lld explicitly via LD=, so this only affects host tools
          if [ -f proton-clang/bin/ld ] && [ ! -f proton-clang/bin/ld.lld ]; then
            rm -f proton-clang/bin/ld
            echo "Removed proton-clang/bin/ld symlink"
          fi
          ls -la proton-clang/bin/ | head -20

      - name: "Set args"
        id: generate-args
        env:
          params: "${{ toJSON(matrix.repos.params) }}"
          THREAD: $(nproc --all)
        run: |
          echo "PATH Variable: $PATH"

          ARCH=$(echo $params | jq -r ".ARCH")
          CC=$(echo $params | jq -r ".CC")

          args="-j${{ env.THREAD }}"
          if [ -n "${{ env.OUT_DIR }}" ]; then
            mkdir -p ${{ env.OUT_DIR }} && args="$args O=${{ env.OUT_DIR }}"
          fi
          if [ -n "$ARCH" ]; then
            args="$args ARCH=$ARCH"
          fi
          if [ -n "$CC" ]; then
            if [ ${{ env.ccache }} = true ]; then
              args="$args CC=\"ccache $CC\""
            else
              args="$args CC=$CC"
            fi
          fi
          while read -r externalCommand; do
            key=$(echo "$externalCommand" | cut -d= -f1)
            value=$(echo "$externalCommand" | cut -d= -f2)
            if [[ "$value" == *"/"* ]]; then
              value="${{ env.WORKSPACE }}/$value"
            fi
            args="$args $key=$value"
          done < <(jq -r '.externalCommand | to_entries[] | "\(.key)=\(.value)"' <<< "$params")

          echo "args: $args"
          echo "ARCH=$ARCH" >> $GITHUB_OUTPUT
          echo "args=$args" >> $GITHUB_OUTPUT

      - name: "Update ReSukiSU"
        working-directory: ${{ env.KERNEL_NAME }}
        env:
          withKernelSU: ${{ matrix.repos.withKernelSU }}
          arch: ${{ steps.generate-args.outputs.ARCH }}
        run: |
          if [ "$withKernelSU" != "true" ]; then
            echo "withKernelSU is not true, skipping ReSukiSU integration"
            exit 0
          fi

          # The kernel tree already ships a 4.4-backported ReSukiSU driver as
          # in-tree files (drivers/kernelsu). Upstream v3.2.0 does not compile
          # on 4.4 (unconditional post-4.4 includes, pre-5.x selinux APIs...),
          # so prefer the in-tree driver and only clone upstream as a fallback
          # for trees that don't carry one.
          rm -rf ./KernelSU
          if [ -d "./drivers/kernelsu" ]; then
            echo "Using in-tree drivers/kernelsu, skipping ReSukiSU clone"
          else
            # ReSukiSU v3.2.0 is the last release that still offers a kprobes hook
            # (v4.x is manual-hook only). This 4.4 kernel has KPROBES on in its
            # defconfig, so the kprobes hook needs no kernel source patching.
            # Note: v3.2.0's own setup.sh clones the wrong upstream (SukiSU-Ultra),
            # so the driver integration is done here explicitly and pinned to the tag.
            git clone --depth 1 --branch v3.2.0 https://github.com/ReSukiSU/ReSukiSU KernelSU

            # v3.2.0 uses MODULE_IMPORT_NS() unconditionally, but that macro only
            # exists on kernel 5.4+ (module symbol namespacing). KSU is built into
            # the kernel here, so the namespace import is irrelevant on 4.4; drop
            # those lines so the driver compiles.
            grep -rl 'MODULE_IMPORT_NS' KernelSU/kernel 2>/dev/null | xargs -r sed -i '/MODULE_IMPORT_NS/d'

            # v3.2.0 includes <linux/compiler_types.h> unconditionally, but that
            # header only exists on kernel 4.18+. Guard it so the 4.4 build works
            # (this mirrors the fix in newer ReSukiSU).
            grep -q '__has_include(<linux/compiler_types.h>)' KernelSU/kernel/allowlist.c || \
              sed -i 's|^#include <linux/compiler_types.h>$|#if __has_include(<linux/compiler_types.h>)\n#include <linux/compiler_types.h>\n#endif|' KernelSU/kernel/allowlist.c

            cd drivers
            ln -sf ../KernelSU/kernel kernelsu
            cd ..
          fi

          # Wire the driver into kbuild (each step is a no-op if already wired).
          cd drivers
          grep -q "kernelsu" Makefile || printf '\nobj-$(CONFIG_KSU) += kernelsu/\n' >> Makefile
          grep -q 'source "drivers/kernelsu/Kconfig"' Kconfig || sed -i '/endmenu/i\source "drivers/kernelsu/Kconfig"' Kconfig
          cd ..

          # Enable KernelSU and select the kprobes hook (also the choice default).
          defconfig="./arch/$arch/configs/$DEFCONFIG_NAME"
          for opt in CONFIG_KSU CONFIG_KSU_KPROBES_HOOK CONFIG_KPROBES CONFIG_HAVE_KPROBES; do
            grep -q "^${opt}=" "$defconfig" || echo "${opt}=y" >> "$defconfig"
          done
          # Spelled CONFIG_KPROBE_EVENTS on 5.x, CONFIG_KPROBE_EVENT on 4.x
          grep -qE "^CONFIG_KPROBE_EVENTS?=y" "$defconfig" || echo "CONFIG_KPROBE_EVENTS=y" >> "$defconfig"

          echo "=== defconfig tail after ReSukiSU integration ==="
          tail -n 8 "$defconfig"

      - name: "Fix incomplete defconfig"
        working-directory: ${{ env.KERNEL_NAME }}
        env:
          arch: ${{ steps.generate-args.outputs.ARCH }}
        run: |
          # The single-SIM yoshino defconfigs are missing several entries that the
          # sibling *_dsds defconfigs (same SoC) include. Without them the build
          # either prompts interactively in CI or fails on an undefined CONFIG_ macro.
          # Each line is only added when absent, so kernels that already define the
          # symbols are left untouched.
          defconfig="./arch/$arch/configs/$DEFCONFIG_NAME"

          # EAS big.LITTLE masks: int symbols with no default, so silentoldconfig
          # would prompt for them and abort. LITTLE=A53 CPU0-3 (0x0f), big=A73 CPU4-7 (0xf0).
          grep -q "^CONFIG_LITTLE_CPU_MASK=" "$defconfig" || echo "CONFIG_LITTLE_CPU_MASK=15" >> "$defconfig"
          grep -q "^CONFIG_BIG_CPU_MASK=" "$defconfig" || echo "CONFIG_BIG_CPU_MASK=240" >> "$defconfig"

          # mdss_fb.c uses CONFIG_DRM_FRAME_BOOST_TIMEOUT as a value unconditionally,
          # but it is only emitted when DEVFREQ_BOOST is on. Enabling it also defines
          # the related sub-options the devfreq_boost driver reads the same way.
          grep -q "^CONFIG_DEVFREQ_BOOST=" "$defconfig" || echo "CONFIG_DEVFREQ_BOOST=y" >> "$defconfig"

          echo "=== ensured symbols ==="
          grep -E "^(CONFIG_LITTLE_CPU_MASK|CONFIG_BIG_CPU_MASK|CONFIG_DEVFREQ_BOOST)=" "$defconfig"

      - name: "Make defconfig"
        working-directory: ${{ env.KERNEL_NAME }}
        env:
          args: ${{ steps.generate-args.outputs.args }}
          arch: ${{ steps.generate-args.outputs.ARCH }}
        run: |
          echo "PATH Variable: $PATH"
          make ${{ env.args }} ${{ env.DEFCONFIG_NAME }}

      - name: "Fix stack protector check"
        working-directory: ${{ env.KERNEL_NAME }}
        run: |
          # The kernel's prepare-compiler-check fails because proton-clang doesn't support -fstack-protector-strong
          # Patch the Makefile to skip this check or use -fstack-protector instead
          sed -i 's/CONFIG_CC_STACKPROTECTOR_STRONG/CONFIG_CC_STACKPROTECTOR/' Makefile
          # Also patch the prepare-compiler-check to not fail on stack protector strong
          sed -i '/stackp-flag := -fstack-protector-strong/s/-fstack-protector-strong/-fstack-protector/' Makefile
          sed -i '/stackp-name := STRONG/s/STRONG//' Makefile

      - name: "Build kernel"
        working-directory: ${{ env.KERNEL_NAME }}
        env:
          args: ${{ steps.generate-args.outputs.args }}
        run: |
          echo "PATH Variable: $PATH"
          make ${{ env.args }}

      - name: "Upload Image"
        uses: actions/upload-artifact@v4
        env:
          arch: ${{ steps.generate-args.outputs.ARCH }}
        with:
          name: Image-${{ env.KERNEL_DEVICE }}-${{ env.KERNEL_NAME }}-${{ env.builddate }}
          path: ${{ env.OUT_DIR }}/arch/${{ env.arch }}/boot/Image
          if-no-files-found: ignore
          retention-days: 7

      - name: "Upload Image.gz"
        uses: actions/upload-artifact@v4
        env:
          arch: ${{ steps.generate-args.outputs.ARCH }}
        with:
          name: Image.gz-${{ env.KERNEL_DEVICE }}-${{ env.KERNEL_NAME }}-${{ env.builddate }}
          path: ${{ env.OUT_DIR }}/arch/${{ env.arch }}/boot/Image.gz
          if-no-files-found: ignore
          retention-days: 7

      - name: "Upload dtb"
        uses: actions/upload-artifact@v4
        env:
          arch: ${{ steps.generate-args.outputs.ARCH }}
        with:
          name: dtb-${{ env.KERNEL_DEVICE }}-${{ env.KERNEL_NAME }}-${{ env.builddate }}
          path: ${{ env.OUT_DIR }}/arch/${{ env.arch }}/boot/Image.gz-dtb
          if-no-files-found: ignore
          retention-days: 7

      - name: "Upload dtbo.img"
        uses: actions/upload-artifact@v4
        env:
          arch: ${{ steps.generate-args.outputs.ARCH }}
        with:
          name: dtbo.img-${{ env.KERNEL_DEVICE }}-${{ env.KERNEL_NAME }}-${{ env.builddate }}
          path: ${{ env.OUT_DIR }}/arch/${{ env.arch }}/boot/dtbo.img
          if-no-files-found: ignore
          retention-days: 7

      - name: "Upload vmlinux (for kallsyms)"
        uses: actions/upload-artifact@v4
        env:
          arch: ${{ steps.generate-args.outputs.ARCH }}
        with:
          name: vmlinux-${{ env.KERNEL_DEVICE }}-${{ env.KERNEL_NAME }}-${{ env.builddate }}
          path: ${{ env.OUT_DIR }}/vmlinux
          if-no-files-found: ignore
          retention-days: 7